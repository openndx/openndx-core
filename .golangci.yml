# golangci-lint configuration. tools/go.mod pins the version: `make fmt`,
# `make lint` and `make check` run it from there, and the *-validate.yml
# workflows read it from there, so a bump changes only that file.
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck and unused
  default: standard
  enable:
    - gosec
  exclusions:
    rules:
      # Tests use fake credentials, local test servers, temp files and
      # fixture paths, which gosec reports as risks.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  # Report every issue, not the first few per linter.
  max-issues-per-linter: 0
  max-same-issues: 0
