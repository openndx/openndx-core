# golangci-lint configuration. GOLANGCI_LINT_VERSION in the Makefile pins the
# version: `make fmt`, `make lint` and `make check` download that release, and
# the *-validate.yml workflows read it from there, so a bump changes only that
# line.
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck and unused
  default: standard
  enable:
    - gosec
  exclusions:
    rules:
      # Tests use fake credentials, local test servers, temp files and
      # fixture paths, which gosec reports as risks.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  # Report every issue, not the first few per linter.
  max-issues-per-linter: 0
  max-same-issues: 0
