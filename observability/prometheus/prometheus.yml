global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'openndx-core'
    environment: 'local'

scrape_configs:
  # Only the Consent Engine serves /metrics. Add a job here for any other
  # service once it serves them (see ../README.md).
  - job_name: consent-engine
    metrics_path: /metrics
    static_configs:
      - targets:
          - consent-engine:8081
        labels:
          service: 'consent-engine'
          port: '8081'
