# Sample data providers for the Orchestration Engine: the mock member services
# of openndx-farajaland (https://github.com/openndx/openndx-farajaland), run
# from its published images. Their sample data is built into the images; the
# Identity Registry's two services read their settings from dev/providers/.
#
# Usage:
#   docker compose -f dev/compose.yml up -d
#   docker compose -f dev/compose.yml down
#
# See dev/README.md.

services:
  identity-registry-api:
    image: ghcr.io/openndx/identity-registry-api:v0.1.0
    container_name: dev-identity-registry-api
    ports:
      - "9090:9090"
    volumes:
      - ./providers/identity-registry-api/Config.toml:/home/ballerina/Config.toml:ro
    restart: unless-stopped

  # GraphQL service in front of identity-registry-api. The OE's
  # identity-registry-v1 provider (cmd/oe/config.docker.yaml and
  # config.example.yaml) points at it.
  identity-registry-adapter:
    image: ghcr.io/openndx/identity-registry-adapter:v0.1.0
    container_name: dev-identity-registry-adapter
    ports:
      - "9091:9091"
    volumes:
      - ./providers/identity-registry-adapter/Config.toml:/home/ballerina/Config.toml:ro
    depends_on:
      - identity-registry-api
    restart: unless-stopped

  # GraphQL service for the OE's civil-registry-v1 provider, with an OAuth2
  # client-credentials token endpoint at /oauth/token.
  civil-registry-api:
    image: ghcr.io/openndx/civil-registry-api:v0.1.0
    container_name: dev-civil-registry-api
    ports:
      - "8080:8080"
    restart: unless-stopped
