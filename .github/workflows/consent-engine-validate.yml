name: Validate Consent Engine

on:
  pull_request:
    branches: [main]
    paths:
      - "cmd/ce/**"
      - "internal/ce/**"
      - "internal/database/**"
      - "internal/config/**"
      - "internal/constants/**"
      - "internal/monitoring/**"
      - "internal/utils/**"
      # init-db.sql loads every service's schema; the bootstrap test applies it
      - "init-db.sql"
      - "cmd/pdp/schema.sql"
      - "cmd/pb/schema.sql"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".dockerignore"
      - ".github/workflows/consent-engine-validate.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_PATH: "cmd/ce"
  REGISTRY: ghcr.io
  GO_VERSION: "1.26"

jobs:
  database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: consent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d consent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/consent_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Initialize CE schema
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f cmd/ce/schema.sql
      - name: Verify PostgreSQL connections
        run: go test -race ./cmd/ce/... ./internal/database -count=1 -v

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # golangci-lint reads the PR diff for only-new-issues
      pull-requests: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Go Mod Tidy
        run: go mod tidy

      - name: Check for unclean Go Mod
        run: |
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod or go.sum files have uncommitted changes. Please run 'go mod tidy' and commit."
            git diff -- go.mod go.sum
            exit 1
          fi
          echo "Go mod files are clean."

      # Settings in .golangci.yml. Reports only issues on lines this PR changes;
      # manual runs have no PR diff to filter by, so they skip it.
      - name: Lint
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          # TODO: once the existing golangci-lint issues are fixed, remove
          # only-new-issues and the `if:` above so every run lints everything.
          only-new-issues: true

      - name: Build application
        run: go build ./${{ env.SERVICE_PATH }}

      - name: Run unit tests
        run: go test ./${{ env.SERVICE_PATH }}/... ./internal/ce/... ./internal/database/... -count=1

      - name: Set lowercase repository owner
        id: repo
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/consent-engine:pr-${{ github.event.pull_request.number || 'manual' }}
          build-args: |
            SERVICE_PATH=${{ env.SERVICE_PATH }}
            BUILD_VERSION=${{ github.sha }}
            BUILD_TIME=${{ github.event.pull_request.updated_at || github.run_id || '2025-01-01T00:00:00Z' }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/consent-engine:pr-${{ github.event.pull_request.number || 'manual' }}
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
