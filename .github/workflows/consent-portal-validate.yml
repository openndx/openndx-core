name: Validate Consent Portal

on:
    pull_request:
        branches: [main]
        paths:
            - "portals/apps/consent/**"
            - "portals/package.json"
            - "portals/pnpm-workspace.yaml"
            - "portals/pnpm-lock.yaml"
            - ".github/workflows/consent-portal-validate.yml"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io

jobs:
    validate:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: portals/package.json

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "pnpm"
                  cache-dependency-path: portals/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: portals
              run: pnpm install --frozen-lockfile --filter consent-portal...

            - name: Lint
              working-directory: portals
              run: pnpm --filter consent-portal run lint

            - name: Test
              working-directory: portals
              run: pnpm --filter consent-portal run test

            - name: Set lowercase repository owner
              id: repo
              run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              uses: docker/build-push-action@v5
              with:
                  context: portals
                  file: portals/apps/consent/Dockerfile
                  push: false
                  load: true
                  tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/consent-portal:pr-${{ github.event.pull_request.number || 'manual' }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/consent-portal:pr-${{ github.event.pull_request.number || 'manual' }}
                  format: "sarif"
                  output: "trivy-results.sarif"

            - name: Upload Trivy scan results
              uses: github/codeql-action/upload-sarif@v3
              if: always()
              with:
                  sarif_file: "trivy-results.sarif"
