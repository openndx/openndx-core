name: Release - Build and Publish All Services

on:
  push:
    tags:
      - "v*.*.*" # Matches semantic version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.tag }}
      build_time: ${{ steps.build-time.outputs.build_time }}
      should_push: ${{ steps.dry-run.outputs.enabled }}
    steps:
      - name: Set Build Time
        id: build-time
        env:
          HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          REPO_PUSHED_AT: ${{ github.event.repository.pushed_at }}
        run: |
          # Fallback logic: head_commit.timestamp -> repository.pushed_at -> current time
          TIMESTAMP="$HEAD_COMMIT_TIMESTAMP"
          if [ -z "$TIMESTAMP" ]; then
            TIMESTAMP="$REPO_PUSHED_AT"
          fi
          if [ -z "$TIMESTAMP" ]; then
            TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          fi
          echo "build_time=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "Build time set to: $TIMESTAMP"

      - name: Determine if this is a dry run
        id: dry-run
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # Only push images for tag pushes on main branch or manual dispatch
          if [[ "$EVENT_NAME" == "push" && "$REF" == refs/tags/* ]] || \
             [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF" == "refs/heads/main" ]]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "✅ Real release mode - will push images"
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "🧪 DRY RUN mode - will build but NOT push images"
          fi

      - name: Extract version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Remove leading 'v' if present
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version tag: ${VERSION}"

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      # Never let one service's failure cancel the builds still in flight for the others.
      fail-fast: false
      matrix:
        service:
          - name: portal-backend
            context: .
            dockerfile: ./portal-backend/Dockerfile
            image: portal-backend
            description: Portal Backend service for the Data Exchange platform
          - name: policy-decision-point
            context: ./exchange/policy-decision-point
            dockerfile: ./exchange/policy-decision-point/Dockerfile
            image: policy-decision-point
            description: Policy Decision Point service for authorization decisions
          - name: consent-engine
            context: .
            dockerfile: ./cmd/ce/Dockerfile
            image: consent-engine
            description: Consent Engine service for managing data consent workflows
          - name: orchestration-engine
            context: .
            dockerfile: ./cmd/oe/Dockerfile
            image: orchestration-engine
            description: Orchestration Engine service for coordinating data exchange workflows
          - name: admin-portal
            context: ./portals
            dockerfile: ./portals/apps/admin/Dockerfile
            image: admin-portal
            description: Admin Portal for the Data Exchange platform
          - name: consent-portal
            context: ./portals
            dockerfile: ./portals/apps/consent/Dockerfile
            image: consent-portal
            description: Consent Portal for the Data Exchange platform
          - name: member-portal
            context: ./portals
            dockerfile: ./portals/apps/member/Dockerfile
            image: member-portal
            description: Member Portal for the Data Exchange platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.image }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ needs.prepare.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.service.description }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ needs.prepare.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_PATH=${{ matrix.service.name }}
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_TIME=${{ needs.prepare.outputs.build_time }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Run Trivy vulnerability scanner
        id: trivy
        if: needs.prepare.outputs.should_push == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: false

      - name: Upload Trivy results to GitHub Security
        if: needs.prepare.outputs.should_push == 'true' && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.service.image }}

      - name: Job summary
        if: always()
        env:
          SERVICE_NAME: ${{ matrix.service.name }}
          MODE: ${{ needs.prepare.outputs.should_push == 'true' && '✅ Release' || '🧪 Dry Run' }}
          REPO_OWNER: ${{ github.repository_owner }}
          SERVICE_IMAGE: ${{ matrix.service.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "### $SERVICE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode:** $MODE" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${REGISTRY}/${REPO_OWNER}/${SERVICE_IMAGE}:${VERSION}\`" >> $GITHUB_STEP_SUMMARY

  create-release:
    needs: [prepare, build-and-push]
    if: github.event_name == 'push' && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ needs.prepare.outputs.version }}
          body: |
            ## Release ${{ needs.prepare.outputs.version }}

            This release includes Docker images for all services and portals:

            - **Portal Backend**: `${{ env.REGISTRY }}/${{ github.repository_owner }}/portal-backend:${{ needs.prepare.outputs.version }}`
            - **Policy Decision Point**: `${{ env.REGISTRY }}/${{ github.repository_owner }}/policy-decision-point:${{ needs.prepare.outputs.version }}`
            - **Consent Engine**: `${{ env.REGISTRY }}/${{ github.repository_owner }}/consent-engine:${{ needs.prepare.outputs.version }}`
            - **Orchestration Engine**: `${{ env.REGISTRY }}/${{ github.repository_owner }}/orchestration-engine:${{ needs.prepare.outputs.version }}`
            - **Admin Portal**: `${{ env.REGISTRY }}/${{ github.repository_owner }}/admin-portal:${{ needs.prepare.outputs.version }}`
            - **Consent Portal**: `${{ env.REGISTRY }}/${{ github.repository_owner }}/consent-portal:${{ needs.prepare.outputs.version }}`
            - **Member Portal**: `${{ env.REGISTRY }}/${{ github.repository_owner }}/member-portal:${{ needs.prepare.outputs.version }}`

            ### Pull Images

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/portal-backend:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/policy-decision-point:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/consent-engine:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/orchestration-engine:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/admin-portal:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/consent-portal:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/member-portal:${{ needs.prepare.outputs.version }}
            ```
          draft: false
          prerelease: false
