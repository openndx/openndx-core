# Fails when a tracked file has no SPDX license header. Every pull request is
# checked, whatever it changes. scripts/license-headers.sh decides which files
# need a header; add missing headers with `make license`.
name: License Headers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check license headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check license headers
        run: scripts/license-headers.sh check
