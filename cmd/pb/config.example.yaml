# Portal Backend configuration for running natively. Copy it to config.yaml
# (git-ignored) and edit the copy:
#   cp cmd/pb/config.example.yaml cmd/pb/config.yaml
# then run `cd cmd/pb && go run .`.
# Keys left out keep their defaults, listed in CONFIGURATION.md.
# A value written as "{{env:NAME}}" or "{{file:/path}}" is read from that
# environment variable or file at startup; an unset variable stops the service.

server:
  port: 8083
  timeout: 15s

# Names the deployment on every log line; leave it out to omit the field.
environment: local

logging:
  level: debug # debug, info, warn or error
  format: text # json (the default) or text

cors:
  # Browser origins of the member and admin portals. "*" is rejected while
  # allowCredentials is true.
  allowedOrigins:
    - http://localhost:5173

idp:
  # Validates incoming access tokens. audience is PB's resource server
  # identifier; tokens for any other audience are rejected.
  jwksURL: http://localhost:8090/oauth2/jwks
  issuer: http://localhost:8090
  audience: http://pb.openndx.local
  # Skips TLS verification of the JWKS fetch. Development only.
  insecureSkipTLSVerify: false
  # PB's own client for ThunderID's management API, which creates each
  # application's OAuth2 client.
  management:
    baseURL: http://localhost:8090
    clientID: PORTAL_BACKEND
    clientSecret: "{{env:PORTAL_BACKEND_CLIENT_SECRET}}"
    scopes: [system]
    # ThunderID's System resource server, which owns the `system` scope.
    resource: https://localhost:8090/mcp
    # Role assigned to every created application; grants it `getdata`.
    # Empty skips the assignment.
    dataConsumerRoleID: 01900000-0000-7000-8000-000000000092

pdp:
  url: http://localhost:8082

database:
  driver: postgres
  postgres:
    host: localhost
    port: 5432
    user: postgres
    password: "{{env:DB_PASSWORD}}"
    name: portal_backend
    sslMode: disable
    pool:
      maxOpenConns: 25
      maxIdleConns: 5
      maxConnLifetimeSeconds: 3600
  idleTimeout: 30m

# OpenTelemetry export over OTLP/HTTP. Audit records go only to the OTLP log
# endpoint, never to stdout: with no endpoint, export is off and audit records
# are dropped (startup logs a warning). endpoint is the OTLP/HTTP base URL;
# /v1/traces, /v1/metrics and /v1/logs are appended. serviceName defaults to
# portal-backend. Put credentials in headers, from "{{env:NAME}}" or "{{file:/path}}".
#
# Local OpenObserve (`make deps OTEL=1`): uncomment, restart, and open
# http://localhost:5080 (root@example.com / Complexpass#123). The header is the
# fixed local root user from compose.yml, not a secret. Steps:
# CONTRIBUTING.md#viewing-audit-records.
# otel:
#   endpoint: http://localhost:5080/api/default
#   headers:
#     Authorization: "Basic cm9vdEBleGFtcGxlLmNvbTpDb21wbGV4cGFzcyMxMjM="
