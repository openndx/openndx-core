# Portal Backend configuration for Docker Compose (compose.yml mounts it at
# /app/config/config.yaml). Values shared with other services come from the
# environment that compose.yml passes in, with the defaults from .env.example.

server:
  port: 8083
  timeout: 15s

environment: local

logging:
  level: info
  format: json

cors:
  # The member and admin portals, run natively with `pnpm dev`.
  allowedOrigins:
    - http://localhost:5173

idp:
  # Reached over the compose network; the issuer is ThunderID's public URL.
  # audience is PB's resource server (thunderid/bootstrap/resource.yaml):
  # clients request `resource=http://pb.openndx.local` at login.
  jwksURL: http://thunderid:8090/oauth2/jwks
  issuer: "{{env:IDP_PUBLIC_URL}}"
  audience: "{{env:PB_AUDIENCE}}"
  # PORTAL_BACKEND is PB's own client (thunderid/bootstrap/application.yaml).
  # Its `system` scope belongs to ThunderID's built-in System resource server,
  # whose identifier is fixed at https://localhost:8090/mcp whatever the
  # public URL.
  management:
    baseURL: http://thunderid:8090
    clientID: PORTAL_BACKEND
    clientSecret: "{{env:PORTAL_BACKEND_CLIENT_SECRET}}"
    scopes: [system]
    resource: https://localhost:8090/mcp
    dataConsumerRoleID: 01900000-0000-7000-8000-000000000092

pdp:
  url: http://policy-decision-point:8082

database:
  driver: postgres
  postgres:
    host: postgres
    port: 5432
    user: "{{env:DB_USER}}"
    password: "{{env:DB_PASSWORD}}"
    name: "{{env:DB_NAME_PB}}"
    sslMode: disable
  idleTimeout: 30m

# OpenTelemetry export over OTLP/HTTP. Audit records go only to the OTLP log
# endpoint, never to stdout: with no endpoint, export is off and audit records
# are dropped (startup logs a warning). endpoint is the OTLP/HTTP base URL;
# /v1/traces, /v1/metrics and /v1/logs are appended. serviceName defaults to
# portal-backend. Put credentials in headers, from "{{env:NAME}}" or "{{file:/path}}".
#
# Local OpenObserve (`make up OTEL=1`): uncomment, restart, and open
# http://localhost:5080 (root@example.com / Complexpass#123). The header is the
# fixed local root user from compose.yml, not a secret. Steps:
# CONTRIBUTING.md#viewing-audit-records.
# otel:
#   endpoint: http://openobserve:5080/api/default
#   headers:
#     Authorization: "Basic cm9vdEBleGFtcGxlLmNvbTpDb21wbGV4cGFzcyMxMjM="
