# Orchestration Engine configuration for Docker Compose (compose.yml mounts it
# at /app/config/config.yaml, next to the schema). Values shared with other
# services come from the environment that compose.yml passes in, with the
# defaults from .env.example.

server:
  port: 4000
  timeout: 30s

environment: local

logging:
  level: info
  format: json

schemaPath: schema.graphql

idp:
  # Reached over the compose network; the issuer is ThunderID's public URL.
  jwksURL: http://thunderid:8090/oauth2/jwks
  issuer: "{{env:IDP_PUBLIC_URL}}"
  audience: "{{env:IDP_AUDIENCE}}"

pdp:
  url: http://policy-decision-point:8082
consentEngine:
  url: http://consent-engine:8081/internal/api/v1
  ownerIdArgName: nic

# The mock providers from dev/compose.yml, running on the host.
providers:
  - id: drp-person-v1
    url: http://host.docker.internal:9091
    auth:
      type: apiKey
      apiKey:
        key: Test-Key
        value: eyJraWQiOiJn
  - id: rgd-person-v1
    url: http://host.docker.internal:8080/graphql
    auth:
      type: oauth2
      oauth2:
        tokenURL: http://host.docker.internal:8080/oauth/token
        clientID: test_client
        clientSecret: test_secret

argMappings:
  # Both providers declare nic as ID!; the consumer schema has String!.
  - schemaId: drp-person-v1
    targetArgName: nic
    sourceArgPath: personInfo-nic
    targetArgPath: person
    targetArgType: "ID!"
  - schemaId: rgd-person-v1
    targetArgName: nic
    sourceArgPath: personInfo-nic
    targetArgPath: getPersonInfo
    targetArgType: "ID!"

# OpenTelemetry export over OTLP/HTTP. Audit records go only to the OTLP log
# endpoint, never to stdout: with no endpoint, export is off and audit records
# are dropped (startup logs a warning). endpoint is the OTLP/HTTP base URL;
# /v1/traces, /v1/metrics and /v1/logs are appended. serviceName defaults to
# orchestration-engine. Put credentials in headers, from "{{env:NAME}}" or "{{file:/path}}".
#
# Local OpenObserve (`make up OTEL=1`): uncomment, restart, and open
# http://localhost:5080 (root@example.com / Complexpass#123). The header is the
# fixed local root user from compose.yml, not a secret. Steps:
# CONTRIBUTING.md#viewing-audit-records.
# otel:
#   endpoint: http://openobserve:5080/api/default
#   headers:
#     Authorization: "Basic cm9vdEBleGFtcGxlLmNvbTpDb21wbGV4cGFzcyMxMjM="
