# Policy Decision Point configuration for running natively. Copy it to
# config.yaml (git-ignored) and edit the copy:
#   cp cmd/pdp/config.example.yaml cmd/pdp/config.yaml
# then run `make run policy-decision-point`.
# Keys left out keep their defaults, listed in README.md.
# A value written as "{{env:NAME}}" or "{{file:/path}}" is read from that
# environment variable or file at startup; an unset variable stops the service.

server:
  port: 8082
  timeout: 10s

# Names the deployment on every log line; leave it out to omit the field.
environment: local

logging:
  level: debug # debug, info, warn or error
  format: text # json (the default) or text

database:
  driver: postgres
  postgres:
    host: localhost
    port: 5432
    user: postgres
    password: "{{env:DB_PASSWORD}}"
    name: pdp
    sslMode: disable
    pool:
      maxOpenConns: 25
      maxIdleConns: 5
      maxConnLifetimeSeconds: 3600
  idleTimeout: 30m

# Custom policy classes: every .rego file in this directory is compiled with
# the built-in classes at startup. See CUSTOM_POLICY_CLASSES.md. Left out, only
# the built-in classes are loaded. A relative path is taken from the directory
# the PDP is started in, which is cmd/pdp for `make run`.
# policy:
#   modulesDir: examples/policies
