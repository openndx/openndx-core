openapi: 3.0.3
info:
  title: Policy Decision Point API
  description: |
    Policy Decision Point API for making authorization decisions in the Data Exchange Platform.
    This service evaluates data access requests against policies and determines if consent is required.
    The service uses database-driven metadata management and supports real-time policy updates.
  version: 1.0.0
  contact:
    name: OpenNDX Team
    email: support@openndx.dev
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8082
    description: Local Development Environment

paths:
  /health:
    get:
      summary: Health Check
      description: Check if the policy decision point service is running and healthy
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: "policy-decision-point"
                  status:
                    type: string
                    example: healthy
  /api/v1/policy/decide:
    post:
      summary: Make Policy Decision
      description: Evaluate data access request against policies and return authorization decision with consent requirements.
      tags:
        - Policy Decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyDecisionRequest'
      responses:
        '200':
          description: Policy Decision Retrieved Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDecisionResponse'
        '400':
          description: Bad request - invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/policy/grants:
    get:
      summary: List Access Grants
      description: List access grants, optionally filtered by application, schema and status. Revoked grants are kept and listed unless filtered out.
      tags:
        - Access Grants
      parameters:
        - name: applicationId
          in: query
          required: false
          description: Only grants held by this application (its OIDC client_id)
          schema:
            type: string
          example: "passport-app"
        - name: schemaId
          in: query
          required: false
          description: Only grants for fields of this schema
          schema:
            type: string
          example: "schema_001"
        - name: status
          in: query
          required: false
          description: Only grants with this status
          schema:
            $ref: '#/components/schemas/GrantStatus'
      responses:
        '200':
          description: Access grants retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrantListResponse'
        '400':
          description: Unknown status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Grant Access to Fields
      description: |
        Grant an application access to fields for a duration, starting now.
        Call this when a consumer application is approved for specific fields.
        A field the application already holds an active grant for has that
        grant's expiry renewed instead of a second grant being created.
      tags:
        - Access Grants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessGrantCreateRequest'
      responses:
        '200':
          description: The application's active grant for each requested field, in request order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrantListResponse'
        '400':
          description: Invalid body, missing applicationId, record without schemaId or fieldName, or unknown grantDuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: A requested field has no policy metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/policy/grants/{id}/revoke:
    post:
      summary: Revoke an Access Grant
      description: Revoke one active grant. The grant is kept with status revoked and no longer gives the application access.
      tags:
        - Access Grants
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the access grant
          schema:
            type: string
      responses:
        '200':
          description: Access grant revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrant'
        '404':
          description: No active grant with this ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/policy/metadata:
    get:
      summary: List Policy Metadata
      description: List current policy metadata records, optionally filtered by schema. Access grants are listed with GET /api/v1/policy/grants.
      tags:
        - Policy Metadata Management
      parameters:
        - name: schemaId
          in: query
          required: false
          description: Optional schema identifier used to filter policy metadata records
          schema:
            type: string
          example: "schema_001"
      responses:
        '200':
          description: Policy metadata retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyMetadataListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create or Update Policy Metadata
      description: Synchronize all policy metadata records for a schema. Existing fields omitted from the request are deleted, together with their access grants.
      tags:
        - Policy Metadata Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyMetadataCreateRequest'
      responses:
        '201':
          description: Policy metadata created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyMetadataCreateResponse'
        '400':
          description: Bad request - invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/policy/metadata/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identifier of the policy metadata record
        schema:
          type: string
    patch:
      summary: Update Policy Metadata
      description: Update selected properties of one policy metadata record without changing other records or its access grants.
      tags:
        - Policy Metadata Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyMetadataPatchRequest'
      responses:
        '200':
          description: Policy metadata updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyMetadataResponse'
        '400':
          description: Invalid request body or access-control type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Policy metadata record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete Policy Metadata
      description: Delete one policy metadata record by ID, together with its access grants.
      tags:
        - Policy Metadata Management
      responses:
        '204':
          description: Policy metadata deleted successfully
        '404':
          description: Policy metadata record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /debug:
    get:
      summary: Debug Information
      description: Get debug information about the policy decision point service
      operationId: getDebugInfo
      tags:
        - Debug
      responses:
        '200':
          description: Debug information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    PolicyDecisionRequest:
      type: object
      required:
        - consumerId
        - applicationId
        - requestId
        - requiredFields
      properties:
        consumerId:
          type: string
          description: ID of the consumer that owns the application
          example: die
        applicationId:
          type: string
          description: ID of the application making the request
          example: passport-app
        requestId:
          type: string
          description: Unique identifier for this request
          example: request_123
        requiredFields:
          type: array
          description: List of data fields being requested
          items:
            type: object
            properties:
              schemaId:
                type: string
                description: Identifier of the data schema
              fieldName:
                type: string
                description: Raw Schema Mapping of the data field being requested
    PolicyDecisionResponse:
      type: object
      description: The decision for every requested field in `fields`. The lists and flags after it are derived from `fields`.
      properties:
        fields:
          type: array
          description: The decision for each requested field, in request order.
          items:
            $ref: '#/components/schemas/PolicyDecisionFieldOutcome'
        appAuthorized:
          type: boolean
          description: Whether the request is allowed
          example: true
        unauthorizedFields:
          type: array
          description: List of fields that are not authorized
          items:
            $ref: '#/components/schemas/PolicyDecisionResponseRecordInfo'
        appAccessExpired:
          type: boolean
          description: Whether the application's access has expired
          example: false
        expiredFields:
          type: array
          description: List of fields for which access has expired
          items:
            $ref: '#/components/schemas/PolicyDecisionResponseRecordInfo'
        appRequiresOwnerConsent:
          type: boolean
          description: Whether the application requires owner consent
          example: true
        consentRequiredFields:
          type: array
          description: List of fields that require owner consent
          items:
            $ref: '#/components/schemas/PolicyDecisionResponseRecordInfo'

    PolicyDecisionFieldOutcome:
      type: object
      required: [schemaId, fieldName, outcome]
      properties:
        schemaId:
          type: string
          description: Identifier of the data schema
          example: "schema_001"
        fieldName:
          type: string
          description: Name of the data field
          example: "person.fullName"
        outcome:
          type: string
          description: The field's decision. The set is fixed; a policy class that returns anything else denies the field.
          enum: [allow, deny, expired, consent_required]
          example: deny
        reason:
          type: string
          description: Why the policy class chose the outcome. Omitted when the class gives none.
          example: not_allowlisted
        obligations:
          type: array
          description: Extra actions the policy asks the Orchestration Engine to take, which it records in the audit trail. Omitted when there are none.
          items:
            type: string
          example: ["audit.consent_bypassed"]

    PolicyDecisionResponseRecordInfo:
      type: object
      properties:
        fieldName:
          type: string
          description: Name of the data field
          example: "person.fullName"
        schemaId:
          type: string
          description: Identifier of the data schema
          example: "schema_001"
        displayName:
          type: string
          description: Human-readable display name for the field
          example: "Full Name"
        description:
          type: string
          description: Description of the data field
          example: "Complete name of the person"
        owner:
          type: string
          description: Owner type of the data field (e.g., citizen, organization)
          example: "citizen"

    DebugResponse:
      type: object
      properties:
        service:
          type: string
          description: Name of the service
          example: policy-decision-point
        version:
          type: string
          description: Service version
          example: "1.0.0"
        uptime:
          type: string
          description: Service uptime
          example: "2h 15m 30s"
        policies_loaded:
          type: integer
          description: Number of policies loaded
          example: 5
        policy_files:
          type: array
          description: List of loaded policy files
          items:
            type: string
          example: [ "main.rego", "field_access.rego" ]
        configuration:
          type: object
          description: Service configuration
          properties:
            environment:
              type: string
              example: local
            log_level:
              type: string
              example: debug
            port:
              type: integer
              example: 8082

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid request format"
        code:
          type: string
          description: Error code
          example: "INVALID_REQUEST"
        details:
          type: object
          description: Additional error details
          properties:
            field:
              type: string
              description: Field that caused the error
              example: "application_id"
            message:
              type: string
              description: Detailed error message
              example: "application_id is required"

    PolicyMetadataCreateRequest:
      type: object
      required:
        - schemaId
        - records
      properties:
        schemaId:
          type: string
          description: Identifier of the data schema
          example: "schema_001"
        records:
          type: array
          description: List of policy metadata records to create
          items:
            $ref: '#/components/schemas/PolicyMetadataCreateRequestRecord'

    PolicyMetadataCreateRequestRecord:
      type: object
      required:
        - fieldName
        - source
        - policyClass
      properties:
        fieldName:
          type: string
          description: Name of the field being created
          example: "person.fullName"
        displayName:
          type: string
          description: Human-readable display name for the field
          example: "Full Name"
        description:
          type: string
          description: Description of the field
          example: "Complete name of the person"
        source:
          type: string
          description: Source system for this field
          enum: [ "primary", "fallback" ]
          example: "primary"
        policyClass:
          $ref: '#/components/schemas/PolicyClass'
        policyParams:
          $ref: '#/components/schemas/PolicyParams'
        owner:
          type: string
          description: Whose consent is asked for the field
          enum: [ "citizen" ]
          nullable: true
          example: "citizen"

    PolicyClass:
      type: string
      description: >
        Policy class that decides access to the field. The built-in classes are
        allowlist (allow-listed applications, no consent), allowlist_consent
        (allow-listed applications with owner consent), consent (any
        application, with owner consent) and open (any application, no
        consent). A class the PDP has not loaded is rejected with 400.
      example: "allowlist_consent"

    PolicyParams:
      type: object
      description: Parameters for the policy class, passed to it as field.params
      additionalProperties: true
      example: {}

    PolicyMetadataPatchRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName:
          type: string
          nullable: true
          description: Updated display name, or null to clear it
          example: "Primary Email Address"
        description:
          type: string
          nullable: true
          description: Updated description, or null to clear it
          example: "Citizen's preferred contact email"
        policyClass:
          $ref: '#/components/schemas/PolicyClass'
        policyParams:
          type: object
          nullable: true
          additionalProperties: true
          description: Replacement parameters for the policy class, or null to clear them

    PolicyMetadataResponse:
      type: object
      required:
        - id
        - schemaId
        - fieldName
        - source
        - policyClass
        - policyParams
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        schemaId:
          type: string
          example: "schema_001"
        fieldName:
          type: string
          example: "person.fullName"
        displayName:
          type: string
          nullable: true
          example: "Full Name"
        description:
          type: string
          nullable: true
          example: "Complete name of the person"
        source:
          type: string
          enum: [ "primary", "fallback" ]
          example: "primary"
        policyClass:
          $ref: '#/components/schemas/PolicyClass'
        policyParams:
          $ref: '#/components/schemas/PolicyParams'
        owner:
          type: string
          enum: [ "citizen" ]
          nullable: true
          example: "citizen"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PolicyMetadataListResponse:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/PolicyMetadataResponse'

    PolicyMetadataCreateResponse:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/PolicyMetadataResponse'

    GrantStatus:
      type: string
      enum: [ "active", "revoked" ]
      description: |
        active grants access until expiresAt; revoked no longer grants access
        and is kept as a record.

    AccessGrantCreateRequest:
      type: object
      required:
        - applicationId
        - grantDuration
        - records
      properties:
        applicationId:
          type: string
          description: OIDC client_id of the application being granted access
          example: "passport-app"
        grantDuration:
          type: string
          enum: [ "30d", "365d" ]
          description: How long the grants last, from the time of the call
          example: "30d"
        records:
          type: array
          description: Fields to grant access to
          items:
            type: object
            required:
              - fieldName
              - schemaId
            properties:
              fieldName:
                type: string
                example: "person.fullName"
              schemaId:
                type: string
                example: "schema_001"

    AccessGrant:
      type: object
      required:
        - id
        - schemaId
        - fieldName
        - applicationId
        - expiresAt
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: "7d3f8a52-1c4e-4b8a-9f6d-2e5b7c9a1d04"
        schemaId:
          type: string
          example: "schema_001"
        fieldName:
          type: string
          example: "person.fullName"
        applicationId:
          type: string
          description: OIDC client_id of the application holding the grant
          example: "passport-app"
        expiresAt:
          type: string
          format: date-time
          description: The grant gives no access after this time; the field is then expired
        status:
          $ref: '#/components/schemas/GrantStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccessGrantListResponse:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/AccessGrant'

tags:
  - name: Health
    description: Health check endpoints
  - name: Policy Decision
    description: Policy decision and authorization operations
  - name: Debug
    description: Debug and diagnostic operations
  - name: Policy Metadata Management
    description: Policy metadata management operations
  - name: Access Grants
    description: Grant, list and revoke applications' access to fields
