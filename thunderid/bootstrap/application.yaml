# LOCAL-DEV ONLY: a sample data-consumer M2M client so the OE `getdata` API can be
# exercised end-to-end without creating an application through the Portal Backend
# first. Remove it for a shared or production deployment, where each consumer is an
# application the Portal Backend creates, with its own ThunderID client.
#
# clientSecret is resolved from DATA_CONSUMER_CLIENT_SECRET at bootstrap time
# (SubstituteEnvironmentVariables); the thunderid-setup service sets it. The
# `getdata` scope it's granted comes from the role in
# thunderid/bootstrap/resource.yaml (id ...092), not from this client config.
resource_type: application
id: 01900000-0000-7000-8000-000000000091
name: Sample Data Consumer
description: Local-dev M2M client for calling the OE data API
type: m2m
ouId: 01900000-0000-7000-8000-000000000001
allowedUserTypes: []
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: DATA_CONSUMER
      clientSecret: "{{ .DATA_CONSUMER_CLIENT_SECRET }}"
      grantTypes:
        - client_credentials
      tokenEndpointAuthMethod: client_secret_basic
      pkceRequired: false
      publicClient: false
      token:
        accessToken:
          clientConfig:
            validityPeriod: 3600
---
# The React Consent Portal's browser OAuth2 client, which citizens log in with.
#
# clientId matches CONSENT_PORTAL_CLIENT_ID in .env, which the consent portal logs in
# with. The portal requests no `resource`, so ThunderID audiences its tokens to the
# client ID, which consent-engine checks as CONSENT_ENGINE_AUDIENCE. That audience
# differs from the OE's (http://api.openndx.local), so a citizen token can't be
# replayed against the OE. redirectUris are built from CONSENT_PORTAL_URL, resolved
# at bootstrap time (SubstituteEnvironmentVariables); the thunderid-setup service
# sets it.
resource_type: application
id: 01900000-0000-7000-8000-0000000000a0
name: Consent Portal
description: React Consent Portal — citizen-facing consent approval UI
type: browser
ouId: 01900000-0000-7000-8000-000000000001
url: "{{ .CONSENT_PORTAL_URL }}"
logoUrl: "avatar:shape=rounded,variant=anonymous_entity,content=shield,colors=0"
authFlowId: 01900000-0000-7000-8000-000000000061
registrationFlowId: 01900000-0000-7000-8000-000000000064
isRegistrationFlowEnabled: true
signOutFlowId: 01900000-0000-7000-8000-00000000006a
recoveryFlowId: 01900000-0000-7000-8000-000000000067
isRecoveryFlowEnabled: true
allowedUserTypes:
  - Person
  - Citizen
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: CONSENT_PORTAL
      redirectUris:
        - "{{ .CONSENT_PORTAL_URL }}"
      postLogoutRedirectUris:
        - "{{ .CONSENT_PORTAL_URL }}"
      grantTypes:
        - authorization_code
        - refresh_token
      responseTypes:
        - code
      pkceRequired: true
      tokenEndpointAuthMethod: none
      publicClient: true
      token:
        accessToken:
          userConfig:
            validityPeriod: 3600
            attributes:
              - given_name
              - family_name
              # consent-engine matches this claim against a consent's owner ID
              # (IDP_SUBJECT_CLAIM=email in compose.yml).
              - email
              - name
        idToken:
          validityPeriod: 3600
          userAttributes:
            - given_name
            - family_name
            - email
            - name
      scopeClaims:
        profile:
          - name
          - given_name
          - family_name
          - picture
        email:
          - email
          - email_verified
        phone:
          - phone_number
          - phone_number_verified
---
# LOCAL-DEV ONLY: the OAuth2 client of the `ondx` management CLI's built-in
# `local` profile, which operators log in with to call Portal Backend's
# management API. Do not mount it into a shared or production deployment;
# there, register a client for `ondx` and save it in a profile
# (cmd/ondx/README.md#configuration).
#
# Like CONSENT_PORTAL above, it is a public browser client with PKCE.
# redirectUris holds one exact loopback URI, so `ondx login` must use callback
# port 8765, which the `local` profile sets.
resource_type: application
id: 01900000-0000-7000-8000-0000000000b0
name: NDX CLI
description: ondx management CLI — operator login for Portal Backend
type: browser
ouId: 01900000-0000-7000-8000-000000000001
authFlowId: 01900000-0000-7000-8000-000000000061
registrationFlowId: 01900000-0000-7000-8000-000000000064
isRegistrationFlowEnabled: false
signOutFlowId: 01900000-0000-7000-8000-00000000006a
recoveryFlowId: 01900000-0000-7000-8000-000000000067
isRecoveryFlowEnabled: false
allowedUserTypes:
  - Person
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: NDX_CLI
      redirectUris:
        - "http://127.0.0.1:8765/callback"
      grantTypes:
        - authorization_code
        - refresh_token
      responseTypes:
        - code
      pkceRequired: true
      tokenEndpointAuthMethod: none
      publicClient: true
      token:
        accessToken:
          userConfig:
            validityPeriod: 3600
            attributes:
              - given_name
              - family_name
              - email
              - roles
              # The user's organization unit. Portal Backend resolves a
              # member user's organization from this claim (members.ou_id).
              - ouId
        idToken:
          validityPeriod: 3600
      scopeClaims:
        roles:
          - roles
          - email
          - ouId
---
# Portal Backend's own confidential M2M client, for its calls to
# ThunderID's management API (provisioning data-consumer applications, see
# internal/pb/idp/thunderid). It gets the `system` scope from the
# PortalBackendSystem role in thunderid/bootstrap/resource.yaml (id ...d1).
#
# clientSecret is resolved from PORTAL_BACKEND_CLIENT_SECRET at bootstrap time;
# the thunderid-setup service sets it, and portal-backend reads the same value
# as idp.management.clientSecret (cmd/pb/config.docker.yaml).
resource_type: application
id: 01900000-0000-7000-8000-0000000000d0
name: Portal Backend
description: Portal Backend's client for ThunderID's management API
type: m2m
ouId: 01900000-0000-7000-8000-000000000001
allowedUserTypes: []
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: PORTAL_BACKEND
      clientSecret: "{{ .PORTAL_BACKEND_CLIENT_SECRET }}"
      grantTypes:
        - client_credentials
      tokenEndpointAuthMethod: client_secret_basic
      pkceRequired: false
      publicClient: false
      token:
        accessToken:
          clientConfig:
            validityPeriod: 3600
