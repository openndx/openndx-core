# LOCAL-DEV ONLY: the operator account for logging in with the `ondx` CLI
# (thunderid/bootstrap/application.yaml, client NDX_CLI). Deliberately separate
# from ThunderID's own built-in "admin"/"Administrators"/"Administrator" trio
# (which gate ThunderID's own Console management UI, on the System resource
# server) — that's a different authorization domain from OpenNDX's own
# application-level roles, so we don't reuse it here.
resource_type: user
id: 01900000-0000-7000-8000-0000000000b1
type: Person
ouHandle: default
attributes:
  username: ndx-admin
  sub: ndx-admin
  email: ndx-admin@openndx.local
  name: NDX Admin
  given_name: NDX
  family_name: Admin
credentials:
  password: "1234"
---
# Membership group the OpenNDX_Admin role (thunderid/bootstrap/resource.yaml) is
# assigned to — ThunderID assigns roles to groups, not directly to users (see
# that file's comment for why).
resource_type: group
id: 01900000-0000-7000-8000-0000000000b2
name: OpenNDX Admins
description: Members of this group get the OpenNDX_Admin role via ThunderID's group-based role assignment
ouHandle: default
members:
  - id: 01900000-0000-7000-8000-0000000000b1
    type: user
---
# LOCAL-DEV ONLY: sample member organizations. A Portal Backend member is an
# organization linked 1:1 to a ThunderID organization unit (members.ou_id), and
# its staff are the users inside that OU. These two match the walkthrough in
# dev/WALKTHROUGH.md: the Identity Registry owns the provider schemas, and the
# Immigration Department registers an application that reads them. Register them in PB with
# `ondx members create --ou-id <id below>`.
resource_type: organization_unit
id: 01900000-0000-7000-8000-0000000000c0
handle: identity-registry
name: Identity Registry
description: Sample member organization that provides the provider schemas
# The default OU's ID (ThunderID's built-in bootstrap); `parent` takes an ID, not a handle.
parent: 01900000-0000-7000-8000-000000000001
---
resource_type: organization_unit
id: 01900000-0000-7000-8000-0000000000c1
handle: immigration
name: Immigration Department
description: Sample member organization that consumes the provider schemas
parent: 01900000-0000-7000-8000-000000000001
---
# LOCAL-DEV ONLY: a staff account for each sample member organization, for
# logging in with the `ondx` CLI (client NDX_CLI) as a member rather than an admin.
# These are deliberately not the citizen accounts above (suresh etc.): citizens
# are data owners who log into the Consent Portal, while these users act for an
# organization. Portal Backend resolves their member from the `ouId` token claim.
resource_type: user
id: 01900000-0000-7000-8000-0000000000c2
type: Person
# By ID: `ouHandle` only resolves top-level OUs, not children of default.
ouId: 01900000-0000-7000-8000-0000000000c0
attributes:
  username: identity-registry-admin
  sub: identity-registry-admin
  email: identity-registry-admin@openndx.local
  name: Identity Registry Admin
  given_name: Identity Registry
  family_name: Admin
credentials:
  password: "1234"
---
resource_type: user
id: 01900000-0000-7000-8000-0000000000c3
type: Person
ouId: 01900000-0000-7000-8000-0000000000c1
attributes:
  username: immigration-admin
  sub: immigration-admin
  email: immigration-admin@openndx.local
  name: Immigration Admin
  given_name: Immigration
  family_name: Admin
credentials:
  password: "1234"
---
# Membership group the OpenNDX_Member role (thunderid/bootstrap/resource.yaml)
# is assigned to, mirroring OpenNDX Admins above. Every member organization's
# staff belong here; which organization they act for comes from their OU, not
# from this group.
resource_type: group
id: 01900000-0000-7000-8000-0000000000c4
name: OpenNDX Members
description: Members of this group get the OpenNDX_Member role via ThunderID's group-based role assignment
ouHandle: default
members:
  - id: 01900000-0000-7000-8000-0000000000c2
    type: user
  - id: 01900000-0000-7000-8000-0000000000c3
    type: user
