# Default values for openndx.
# This is a YAML-formatted file.
#
# This chart deploys OpenNDX's maintained services from a single values file:
#   - orchestrationEngine (Core - always deployed)
#   - policyDecisionPoint (Optional - enabled by default)
#   - consentEngine       (Optional - enabled by default)
#   - consentPortal       (Optional - enabled by default)
#   - portalBackend       (Optional - enabled by default)
#
# The embedded identity provider, ThunderID, is required and is installed from
# its published chart (oci://ghcr.io/thunder-id/helm-charts/thunderid) as a
# release named `thunderid`, which serves at http://thunderid-service:8090.
# The idp URLs below assume that; see README.md#embedded-identity-provider-thunderid.
#
# Other infrastructure (PostgreSQL, and the OpenTelemetry collector or backend
# that receives audit records) is provisioned separately via its own Helm
# chart or a managed cloud service; each service's `config` points at it.
#
# Each Go service's `config` block IS its config.yaml, with the same schema as
# cmd/<svc>/config.example.yaml (keys are listed in cmd/<svc>/README.md). The
# chart renders it as-is into a ConfigMap mounted at /app/config/config.yaml.
# The one exception is the deployment's public URLs: left empty, they are
# filled in from global.idpPublicURL and the ingress hosts, and the install
# fails if they can't be (see README.md#required-values). Keep config
# non-secret: a secret goes in as a "{{env:NAME}}" placeholder the service
# resolves at startup, with NAME set through the service's env (usually a
# valueFrom secretKeyRef).
#
# The URLs one service uses to call another (the OE's pdp.url and
# consentEngine.url, the Portal Backend's pdp.url) are left out: the chart
# fills each in from the release's Service name while that service is enabled.
# Set one to call a service outside the chart.

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Global & Shared Settings
# ---------------------------------------------------------------------------
global:
  imagePullSecrets: []
  # Required. ThunderID's public URL (its configuration.server.publicUrl): where
  # browsers sign in, and the issuer of every token. Fills in each service's
  # config.idp.issuer and the Consent Portal's idpBaseURL when they are empty.
  idpPublicURL: ""

# NetworkPolicies limiting inbound traffic to each service's port. The PDP's API
# and the Consent Engine's /internal API have no authentication and rely on
# them: the PDP accepts only the OE and Portal Backend, the Consent Engine only
# the OE and, while its ingress is on, ingressFrom. Any other caller of a
# service goes in that service's networkPolicy.extraFrom. They take effect only
# where the cluster's network plugin enforces NetworkPolicy. Egress is not
# limited.
networkPolicy:
  enabled: true
  # Where the ingress controller's pods run, as NetworkPolicy `from` peers.
  # Required while any service's ingress is enabled, and added only to the
  # policies of services whose ingress is enabled. Don't list other callers
  # here: they would reach every exposed service, the Consent Engine's
  # /internal API included. For example:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  ingressFrom: []

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Mount a Kubernetes API token into the pods? No OpenNDX service calls the
  # Kubernetes API, so this stays off unless something added to the pods needs it.
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# ---------------------------------------------------------------------------
# 1. Orchestration Engine (Core - Always Deployed)
# ---------------------------------------------------------------------------
orchestrationEngine:
  replicaCount: 1

  image:
    repository: ghcr.io/openndx/orchestration-engine
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 4000

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: api.openndx.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Callers allowed in by this service's NetworkPolicy besides the chart's own
  # and, while the ingress is on, networkPolicy.ingressFrom: NetworkPolicy
  # `from` peers, such as in-cluster clients or a monitoring scraper's
  # namespace. With none of these, and the ingress off, anyone is allowed.
  networkPolicy:
    extraFrom: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  # /health answers while the process serves. The OE has no database, so it
  # is also its readiness check.
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Environment variables, as a map of name to a plain value or a map such as
  # {valueFrom: {secretKeyRef: {name, key}}}: the secrets config references as
  # "{{env:NAME}}". None by default; for an otel endpoint that needs
  # credentials, add e.g.
  #   OTEL_AUTH_HEADER:
  #     valueFrom:
  #       secretKeyRef: {name: openndx-secrets, key: otelAuthHeader}
  env: {}
  # Load environment from existing ConfigMaps or Secrets
  envFrom: []

  # config.yaml. See cmd/oe/config.example.yaml.
  config:
    server:
      port: 4000
      timeout: 30s
    environment: local
    logging:
      level: info
      format: json
    # Resolved against /app/config; the file comes from configFiles below.
    schemaPath: schema.graphql
    idp:
      jwksURL: http://thunderid-service:8090/oauth2/jwks
      # Empty: global.idpPublicURL.
      issuer: ""
      # OE's resource-server identifier (thunderid/bootstrap/resource.yaml),
      # not a URL to reach.
      audience: http://api.openndx.local
      insecureSkipTLSVerify: false
    # pdp.url and consentEngine.url are left out, so the chart fills them in
    # with its own PDP and Consent Engine (http://<fullname>-pdp:8082,
    # http://<fullname>-ce:8081/internal/api/v1). The install fails
    # when one is left out and its service is disabled. Set a URL to use one
    # outside the chart, or pdp.url: "" to switch off authorization and
    # consent, which also makes consentEngine.url unnecessary:
    # pdp:
    #   url: ""
    consentEngine:
      # The query argument that identifies the data owner whose consent is
      # asked. Required while consentEngine.url is set.
      ownerIdArgName: nic
    # The actor recorded on the audit events the OE initiates (its calls to
    # the PDP, the Consent Engine and providers).
    audit:
      actorType: SERVICE
      actorId: orchestration-engine
    # Data providers federated by the Orchestration Engine. The chart deploys
    # none: list yours, one per schema ID the consumer schema's @sourceInfo
    # uses (cmd/oe/PROVIDER_CONFIGURATION.md). For example:
    #   - id: identity-registry-v1
    #     url: https://identity-registry.example.org/graphql
    #     auth:
    #       type: apiKey
    #       apiKey:
    #         key: X-API-Key
    #         value: "{{env:IDENTITY_REGISTRY_API_KEY}}"
    providers: []
    # Argument mappings from consumer schema arguments to provider arguments,
    # e.g. {schemaId: identity-registry-v1, targetArgName: nic,
    # sourceArgPath: personInfo-nic, targetArgPath: person, targetArgType: "ID!"}
    argMappings: []
    # OpenTelemetry export over OTLP/HTTP. Audit records are sent only as OTLP
    # logs, so they are dropped while no endpoint is set. For example:
    #   otel:
    #     endpoint: http://otel-collector:4318
    #     headers:
    #       Authorization: "{{env:OTEL_AUTH_HEADER}}"

  # Extra files mounted next to config.yaml in /app/config, keyed by file name.
  # Required: the consumer GraphQL schema named by config.schemaPath, e.g.
  #   --set-file 'orchestrationEngine.configFiles.schema\.graphql=schema.graphql'
  # cmd/oe/schema.graphql is the sample schema for the mock providers in dev/.
  configFiles: {}

# ---------------------------------------------------------------------------
# 2. Policy Decision Point (Optional)
# ---------------------------------------------------------------------------
policyDecisionPoint:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/openndx/policy-decision-point
    pullPolicy: IfNotPresent
    tag: ""

  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 8082

  # Callers allowed in besides the OE and Portal Backend, as NetworkPolicy
  # `from` peers, such as an external Portal Backend or a monitoring scraper.
  # The PDP's API has no authentication: anything listed here can change
  # access grants.
  networkPolicy:
    extraFrom: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # /health answers while the process serves; it doesn't check the database
  # yet, so readiness uses it too until a readiness endpoint exists (#652).
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Environment variables: a plain value or a valueFrom map per name. Supplies
  # the secrets config references as "{{env:NAME}}"; point them at your own
  # Secret.
  env:
    DB_USER:
      valueFrom:
        secretKeyRef: {name: openndx-secrets, key: dbUser}
    DB_PASSWORD:
      valueFrom:
        secretKeyRef: {name: openndx-secrets, key: dbPassword}
  # Load environment from existing ConfigMaps or Secrets
  envFrom: []

  # config.yaml. See cmd/pdp/config.example.yaml.
  config:
    server:
      port: 8082
      timeout: 10s
    environment: local
    logging:
      level: info
      format: json
    database:
      driver: postgres
      postgres:
        host: postgresql
        port: 5432
        user: "{{env:DB_USER}}"
        password: "{{env:DB_PASSWORD}}"
        name: pdp
        sslMode: require
      idleTimeout: 30m

# ---------------------------------------------------------------------------
# 3. Consent Engine (Optional)
# ---------------------------------------------------------------------------
consentEngine:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/openndx/consent-engine
    pullPolicy: IfNotPresent
    tag: ""

  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 8081

  ingress:
    enabled: false
    className: ""
    annotations: {}
    # Routes only the public API (/api/v1), which the Consent Portal calls
    # from the browser. Avoid widening it (to / for example): that would also
    # expose /internal/api/v1, which has no authentication, and /metrics.
    hosts:
      - host: consent-api.openndx.local
        paths:
          - path: /api/v1
            pathType: Prefix
    tls: []

  # Callers allowed in besides the OE and, while the ingress is on,
  # networkPolicy.ingressFrom, as NetworkPolicy `from` peers, such as a
  # monitoring scraper. The /internal API has no authentication: anything
  # listed here can read and create consents.
  networkPolicy:
    extraFrom: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # /health answers while the process serves; it doesn't check the database
  # yet, so readiness uses it too until a readiness endpoint exists (#652).
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Environment variables: a plain value or a valueFrom map per name. Supplies
  # the secrets config references as "{{env:NAME}}"; point them at your own
  # Secret.
  env:
    DB_USER:
      valueFrom:
        secretKeyRef: {name: openndx-secrets, key: dbUser}
    DB_PASSWORD:
      valueFrom:
        secretKeyRef: {name: openndx-secrets, key: dbPassword}
  # Load environment from existing ConfigMaps or Secrets
  envFrom: []

  # config.yaml. See cmd/ce/config.example.yaml.
  config:
    server:
      port: 8081
      timeout: 10s
    environment: local
    logging:
      level: info
      format: json
    # Consent links are <consentPortalURL>?consentId=<uuid>. Empty: the
    # Consent Portal's ingress URL.
    consentPortalURL: ""
    cors:
      allowedOrigins: []
    idp:
      jwksURL: http://thunderid-service:8090/oauth2/jwks
      # Empty: global.idpPublicURL.
      issuer: ""
      audience: CONSENT_PORTAL
      # Matched against a consent's owner ID. Users must not be able to change it:
      # refuse ThunderID's PUT /users/me (README, "Refuse self-service attribute
      # changes").
      subjectClaim: nic
      insecureSkipTLSVerify: false
    database:
      driver: postgres
      postgres:
        host: postgresql
        port: 5432
        user: "{{env:DB_USER}}"
        password: "{{env:DB_PASSWORD}}"
        name: consent_engine
        sslMode: require
      idleTimeout: 30m

# ---------------------------------------------------------------------------
# 4. Consent Portal UI (Optional)
# ---------------------------------------------------------------------------
consentPortal:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/openndx/consent-portal
    pullPolicy: IfNotPresent
    tag: ""

  podAnnotations: {}
  podLabels: {}
  # RuntimeDefault seccomp only: the nginx image runs as root and its
  # entrypoint writes config.js into the image, so the rest of the hardening
  # the Go services get waits on an unprivileged image.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext: {}

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: consent.openndx.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Callers allowed in by this service's NetworkPolicy besides the chart's own
  # and, while the ingress is on, networkPolicy.ingressFrom: NetworkPolicy
  # `from` peers, such as in-cluster clients or a monitoring scraper's
  # namespace. With none of these, and the ingress off, anyone is allowed.
  networkPolicy:
    extraFrom: []

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # nginx serves /health itself.
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Environment variables: a plain value or a valueFrom map per name.
  env: {}
  # Load environment from existing ConfigMaps or Secrets
  envFrom: []

  # Browser-reachable URLs. The image's entrypoint writes them into config.js
  # from environment variables at container start, so they are passed as env
  # rather than mounted. Each URL left empty is filled in as noted.
  config:
    # Empty: the Consent Engine's ingress URL + /api/v1.
    consentEngineURL: ""
    idpClientId: "CONSENT_PORTAL"
    # Empty: global.idpPublicURL.
    idpBaseURL: ""
    idpScope: "openid profile email"
    # Empty: this portal's ingress URL.
    idpSignInRedirectURL: ""
    idpSignOutRedirectURL: ""

# ---------------------------------------------------------------------------
# 5. Portal Backend (Optional)
# ---------------------------------------------------------------------------
portalBackend:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/openndx/portal-backend
    pullPolicy: IfNotPresent
    tag: ""

  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 8083

  ingress:
    enabled: false
    className: ""
    annotations: {}
    # Routes only the API (/api/v1), which is all clients call. Avoid widening
    # it (to / for example): that would also expose /health and any other
    # route outside the API.
    hosts:
      - host: pb.openndx.local
        paths:
          - path: /api/v1
            pathType: Prefix
    tls: []

  # Callers allowed in by this service's NetworkPolicy besides the chart's own
  # and, while the ingress is on, networkPolicy.ingressFrom: NetworkPolicy
  # `from` peers, such as in-cluster clients or a monitoring scraper's
  # namespace. With none of these, and the ingress off, anyone is allowed.
  networkPolicy:
    extraFrom: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # /health answers while the process serves; it doesn't check the database
  # yet, so readiness uses it too until a readiness endpoint exists (#652).
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Environment variables: a plain value or a valueFrom map per name. Supplies
  # the secrets config references as "{{env:NAME}}"; point them at your own
  # Secret. For an otel endpoint that needs credentials, also add
  # OTEL_AUTH_HEADER.
  env:
    DB_USER:
      valueFrom:
        secretKeyRef: {name: openndx-secrets, key: dbUser}
    DB_PASSWORD:
      valueFrom:
        secretKeyRef: {name: openndx-secrets, key: dbPassword}
    PORTAL_BACKEND_CLIENT_SECRET:
      valueFrom:
        secretKeyRef: {name: openndx-secrets, key: pbClientSecret}
  # Load environment from existing ConfigMaps or Secrets
  envFrom: []

  # config.yaml. See cmd/pb/config.example.yaml. The Portal Backend requires
  # a PDP: pdp.url is left out, so the chart fills it in with its own
  # (http://<fullname>-pdp:8082). With policyDecisionPoint disabled,
  # set pdp.url to an external PDP; otherwise the install fails.
  config:
    server:
      port: 8083
      timeout: 15s
    environment: local
    logging:
      level: info
      format: json
    cors:
      # Required: the browser origins allowed to call Portal Backend. It
      # refuses to start without one, even if only the ondx CLI calls it.
      allowedOrigins: []
    idp:
      jwksURL: http://thunderid-service:8090/oauth2/jwks
      # Empty: global.idpPublicURL.
      issuer: ""
      # PB's resource-server identifier, not a URL to reach.
      audience: http://pb.openndx.local
      insecureSkipTLSVerify: false
      management:
        baseURL: http://thunderid-service:8090
        clientID: PORTAL_BACKEND
        clientSecret: "{{env:PORTAL_BACKEND_CLIENT_SECRET}}"
        scopes:
          - system
        # The identifier of ThunderID's built-in System resource server, which
        # owns the `system` scope. ThunderID fixes it at this value whatever
        # its public URL; it is not a URL to reach.
        resource: https://localhost:8090/mcp
        dataConsumerRoleID: "01900000-0000-7000-8000-000000000092"
    database:
      driver: postgres
      postgres:
        host: postgresql
        port: 5432
        user: "{{env:DB_USER}}"
        password: "{{env:DB_PASSWORD}}"
        name: portal_backend
        sslMode: require
      idleTimeout: 30m
    # OpenTelemetry export over OTLP/HTTP. Audit records are sent only as OTLP
    # logs, so they are dropped while no endpoint is set. For example:
    #   otel:
    #     endpoint: http://otel-collector:4318
    #     headers:
    #       Authorization: "{{env:OTEL_AUTH_HEADER}}"
