{{- $fullname := include "openndx.fullname" . }}
{{- range $name, $c := include "openndx.components" . | fromYaml }}
{{- $v := index $.Values $c.values }}
{{- if and $c.enabled (dig "autoscaling" "enabled" false $v) }}
{{- $autoscaling := $v.autoscaling }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-{{ $name }}
  labels:
    {{- include "openndx.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c.component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-{{ $name }}
  minReplicas: {{ $autoscaling.minReplicas }}
  maxReplicas: {{ $autoscaling.maxReplicas }}
  metrics:
    {{- with $autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
