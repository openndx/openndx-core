{{- $fullname := include "openndx.fullname" . }}
{{- range $name, $c := include "openndx.components" . | fromYaml }}
{{- if $c.enabled }}
{{- $v := index $.Values $c.values }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $name }}
  labels:
    {{- include "openndx.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c.component }}
spec:
  {{- if not (dig "autoscaling" "enabled" false $v) }}
  replicas: {{ $v.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openndx.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $c.component }}
  template:
    metadata:
      {{- if or $c.configMap $v.podAnnotations }}
      annotations:
        {{- if $c.configMap }}
        checksum/config: {{ dict "config" $v.config "files" $v.configFiles | toYaml | sha256sum }}
        {{- end }}
        {{- with $v.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "openndx.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $c.component }}
        {{- with $v.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openndx.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $c.component }}
          securityContext:
            {{- toYaml $v.securityContext | nindent 12 }}
          image: "{{ $v.image.repository }}:{{ $v.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $c.containerPort }}
              protocol: TCP
          env:
            {{- range $c.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- /* A plain value, or a map such as {valueFrom: {secretKeyRef: ...}}. */}}
            {{- range $key, $value := $v.env }}
            - name: {{ $key }}
              {{- if kindIs "map" $value }}
              {{- toYaml $value | nindent 14 }}
              {{- else }}
              value: {{ $value | quote }}
              {{- end }}
            {{- end }}
            {{- /* The chart-rendered config.yaml, unless env names another. */}}
            {{- if and $c.configMap (not (hasKey ($v.env | default dict) "CONFIG_PATH")) }}
            - name: CONFIG_PATH
              value: /app/config/config.yaml
            {{- end }}
          {{- with $v.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            {{- toYaml $c.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          {{- if $c.configMap }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          {{- end }}
      {{- if $c.configMap }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-{{ $name }}-config
      {{- end }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
