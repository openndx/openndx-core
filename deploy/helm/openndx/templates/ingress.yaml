{{- $fullname := include "openndx.fullname" . }}
{{- range $name, $c := include "openndx.components" . | fromYaml }}
{{- $v := index $.Values $c.values }}
{{- if and $c.enabled (dig "ingress" "enabled" false $v) }}
{{- $ingress := $v.ingress }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-{{ $name }}
  labels:
    {{- include "openndx.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c.component }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullname }}-{{ $name }}
                port:
                  number: {{ $v.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
